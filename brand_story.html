<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=1700">
    <!-- 브라우저 뷰포트 너비를 1360px로 고정하여 페이지를 그리도록 설정 -->
    <title>LUMEN BRAND STORY</title>
    <!-- webfont 연결-->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="https://use.typekit.net/qry0poy.css">

    <!-- font-family: Pretendard, sans-serif;  -->
    <!-- font-family: "athena", sans-serif;-->


    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />


    <!-- 외부 css 연결 -->
    <link rel="stylesheet" href="css/brand_story.css">


    <!-- favicon -->
    <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
</head>

<body>

    <div id="wrap">

        <!-- ================ [서브 고유 영역] 컨텐츠 시작 ================ -->
        <main id="container" class="sub_page">

            <!-- 0~100% 인트로 섹션 -->
            <section class="story_intro_section">
                <div class="story_sticky_wrap">

                    <!-- 이미지 슬라이드 영역 -->
                    <div class="story_img_container">
                        <!-- 첫 번째 이미지 -->
                        <div class="story_slide active"
                            style="background-image: url('./images/brand/brand_story_01.jpg');"></div>
                        <!-- 두 번째 이미지 -->
                        <div class="story_slide" style="background-image: url('./images/brand/brand_story_02.jpg');">
                        </div>
                        <!-- 세 번째 이미지 -->
                        <div class="story_slide" style="background-image: url('./images/brand/brand_story_03.jpg')">
                        </div>
                        <!-- 네 번째 이미지 -->
                        <div class="story_slide" style="background-image: url('./images/brand/brand_story_04.jpg')">
                        </div>
                    </div>


                    <!-- 하단 0~100% 카운터 및 로고 영역 -->
                    <div class="story_bottom_bar">
                        <div class="counter_wrap">
                            <span id="counter_num">0</span>%
                        </div>
                        <div class="bottom_logo">
                            <img src="./images/common/sub_logo_black.svg" alt="">
                        </div>
                    </div>
            </section>
    </div>



    <!-- ================ [공통 영역 1] 헤더 시작 ============== -->
    <div class="header">
        <h1 class="logo">
            <a href="index.html">
                <img src="./images/common/logo_black.svg" alt="main_logo">
            </a>
        </h1>

        <ul class="nav">
            <li>
                <a href="#">Brand Story</a>
            </li>
            <li>
                <a href="#">Shop</a>
            </li>
            <li>
                <a href="#">Accessories</a>
            </li>
            <li>
                <a href="#">Lumen Care</a>
            </li>
            <li>
                <a href="#">Store</a>
            </li>
            <li>
                <a href="#">Lookbook</a>
            </li>
        </ul>
    </div>
    <!-- =============== [공통 영역 1] 헤더 끝 ================ -->


    <!-- 인트로 이후 이어지는 일반 스토리 본문 섹션 -->
    <section class="story_text_section">
        <div class="inner">
            <h2>빛의 본질을 담아내는 여정</h2>
            <p>LUMEN은 단순한 디자인을 넘어 형태와 감각 사이의 균형을 찾아냅니다.</p>
        </div>
    </section>

    </main>
    <!-- ================= [서브 고유 영역] 컨텐츠 끝 ================= -->


    <!-- ================= [공통 영역 2] 푸터 시작 ================= -->
    <div id="footer_wrap">
        <div class="footer_section">

            <!-- 좌측 로고 및 정보 영역 -->
            <div class="footer-left">
                <div class="logo-wrapper">
                    <h1 class="logo">
                        <a href="#">
                            <img src="./images/common/logo_black.svg" alt="logo">
                        </a>
                    </h1>
                </div>

                <div class="company-info">
                    <p><span>대표명</span> 김시현</p>
                    <p><span>전화번호</span> 010 - 1234 - 5678</p>
                    <p><span>이메일</span> 123456@gmial.com</p>
                    <p><span>위치</span> 부산광역시 수영구 광안해변로 219 일대</p>
                </div>
            </div>

            <!-- 우측 소셜 링크 영역 -->
            <div class="footer-right">
                <ul class="sns-list">
                    <li>
                        <a href="https://www.instagram.com/" target="_blank">
                            <span class="sns-name">instagram</span>
                            <span class="arrow">→</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.kakaocorp.com/page/" target="_blank">
                            <span class="sns-name">kakaotalk</span>
                            <span class="arrow">→</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR" target="_blank">
                            <span class="sns-name">youtube</span>
                            <span class="arrow">→</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <!-- ================= [공통 영역 2] 푸터 끝 ================= -->



    </div>



    <!-- jQuery 오픈소스 연결 -->
    <script src="./js/jquery-4.0.0.min.js"></script>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- jQuery 파일 연결 -->
    <script src="js/script.js"></script>

</html>
